function txtW(s, sc = 1) { return s.length ? s.length * 4 * sc - sc : 0; }
function txt(s, x, y, c, sc = 1, al = 0) {
  s = String(s).toUpperCase();
  if (al === 1) x -= txtW(s, sc) / 2; else if (al === 2) x -= txtW(s, sc);
  x = Math.round(x); y = Math.round(y);
  ctx.fillStyle = PAL[c];
  for (const ch of s) {
    const g = FONT[ch];
    if (g) for (let i = 0; i < 15; i++) if (g[i] === '1') ctx.fillRect(x + (i % 3) * sc, y + ((i / 3) | 0) * sc, sc, sc);
    x += 4 * sc;
  }
}
function txtS(s, x, y, c, sc = 1, al = 0, sh = 0) { txt(s, x + sc, y + sc, sh, sc, al); txt(s, x, y, c, sc, al); }

const STAR_SPR = ['00100','01110','11111','01110','01010'];

  for (let j = 0; j < 5; j++) for (let i = 0; i < 5; i++)

// ---------------- Audio (Web Audio, 8-bit style) ----------------
let AC = null, master = null, thrG = null, noiseBuf = null;
function audioInit() {
  if (AC) { if (AC.state === 'suspended') AC.resume(); return; }
  try {
    AC = new (window.AudioContext || window.webkitAudioContext)();
    master = AC.createGain(); master.gain.value = SAVE.muted ? 0 : 0.45; master.connect(AC.destination);
    const len = AC.sampleRate;
    noiseBuf = AC.createBuffer(1, len, AC.sampleRate);
    const d = noiseBuf.getChannelData(0); let v = 0;
    for (let i = 0; i < len; i++) { if (i % 6 === 0) v = Math.random() * 2 - 1; d[i] = v; }  // crunchy sample-and-hold noise
    const src = AC.createBufferSource(); src.buffer = noiseBuf; src.loop = true;
    const f = AC.createBiquadFilter(); f.type = 'lowpass'; f.frequency.value = 700;
    thrG = AC.createGain(); thrG.gain.value = 0;
    src.connect(f); f.connect(thrG); thrG.connect(master); src.start();
  } catch (e) { AC = null; }
}
function setThrustSound(on) { if (thrG) thrG.gain.setTargetAtTime(on ? 0.22 : 0, AC.currentTime, 0.03); }
function tone(freq, dur, type = 'square', vol = 0.12, slide = null, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, o = AC.createOscillator(), g = AC.createGain();
  o.type = type; o.frequency.setValueAtTime(freq, t0);
  if (slide) o.frequency.exponentialRampToValueAtTime(slide, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.setValueAtTime(vol, t0 + dur * 0.6); g.gain.linearRampToValueAtTime(0.0001, t0 + dur);
  o.connect(g); g.connect(master); o.start(t0); o.stop(t0 + dur + 0.05);
}
function noise(dur, vol, freq, delay = 0) {
  if (!AC) return;
  const t0 = AC.currentTime + delay, s = AC.createBufferSource(), f = AC.createBiquadFilter(), g = AC.createGain();
  s.buffer = noiseBuf; f.type = 'lowpass'; f.frequency.setValueAtTime(freq, t0); f.frequency.exponentialRampToValueAtTime(80, t0 + dur);
  g.gain.setValueAtTime(vol, t0); g.gain.exponentialRampToValueAtTime(0.001, t0 + dur);
  s.connect(f); f.connect(g); g.connect(master); s.start(t0); s.stop(t0 + dur + 0.05);
}

  const s = JSON.parse(localStorage.getItem(SKEY));

    if (Array.isArray(s.stars)) for (let i = 0; i < 25; i++) SAVE.stars[i] = clamp(s.stars[i] | 0, 0, 3);
    if (Array.isArray(s.best)) for (let i = 0; i < 25; i++) SAVE.best[i] = s.best[i] | 0;

} catch (e) {}

// ---------------- Level building ----------------
function buildGrid(L) {
  const g = [];
  for (let y = 0; y < L.h; y++) g.push(Array(L.w).fill('#'));
  const set = (x, y, ch) => { if (x >= 0 && y >= 0 && x < L.w && y < L.h) g[y][x] = ch; };
  const fillr = (x, y, w, h, ch) => { for (let j = 0; j < h; j++) for (let i = 0; i < w; i++) set(x + i, y + j, ch); };
  L.b({
    c: (x, y, w, h) => fillr(x, y, w, h, '.'),
    f: (x, y, w, h) => fillr(x, y, w, h, '#'),
    r: (x, y, w, h, ch) => fillr(x, y, w, h, ch),
    s: (x, y, n, ch) => fillr(x, y, n, 1, ch),
    v: (x, y, n, ch) => fillr(x, y, 1, n, ch),
    p: (x, y, ch) => set(x, y, ch),
    st: (x, y) => set(x, y, '*')
  });
  return g;
}

function mvPos(m, t) {
  const f = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + m[7]) / m[6]);
  return { x: (m[0] + m[4] * f) * TS, y: (m[1] + m[5] * f) * TS, w: m[2] * TS, h: m[3] * TS };
}
function enPos(e, t) {
  if (e[0] === 'o') {
    const a = 2 * Math.PI * (t + e[5]) / e[4];
    return { x: (e[1] + e[3] * Math.cos(a)) * TS + 4, y: (e[2] + e[3] * Math.sin(a)) * TS + 4 };
  }
  const f = 0.5 - 0.5 * Math.cos(2 * Math.PI * (t + e[6]) / e[5]);
  return { x: (e[1] + e[3] * f) * TS + 4, y: (e[2] + e[4] * f) * TS + 4 };
}
function laserOn(l, t) { return ((t + l[6]) % l[4]) < l[5]; }
function laserWarn(l, t) { const p = (t + l[6]) % l[4]; return p >= l[4] - 40; }

// ---------------- Game state ----------------
// S holds only plain data so it can be snapshotted (used by the autopilot playtester).
let S = null, layer = null, parts = [], cam = { x: 0, y: 0 }, shake = 0;

function loadLevel(li, attempt = 1) {
  const L = LV[li];
  const grid = buildGrid(L);
  const s = {
    li, w: L.w, h: L.h, grid, t: 0, attempt,
    rocket: { x: 0, y: 0, vx: 0, vy: 0, a: 0 },
    fuel: L.fuel, maxFuel: L.fuel, stars: [], sw: [], open: { A: false, B: false, C: false },
    status: 'play', rest: null, winN: 0, thr: false, deathT: 0, lock: true, mvp: [],
    mv: L.mv || [], en: L.en || [], lz: L.lz || [], wd: L.wd || [], gz: L.gz || []
  };
  let sx = 0, sn = 0, sy = 0;
  for (let y = 0; y < L.h; y++) for (let x = 0; x < L.w; x++) {
    const ch = grid[y][x];
    if (ch === 'S') { sx += x; sn++; sy = y; }
    else if (ch === '*') { s.stars.push({ x: x * TS + 4, y: y * TS + 4, got: false }); grid[y][x] = '.'; }
    else if (ch === 'a' || ch === 'b' || ch === 'c') { s.sw.push({ x: x * TS + 4, y: y * TS + 4, k: ch.toUpperCase(), on: false }); grid[y][x] = '.'; }
  }
  s.rocket.x = (sx / sn) * TS + 4;
  s.rocket.y = sy * TS - 4.51;
  s.rest = { k: 'S' };
  s.mvp = s.mv.map(m => mvPos(m, 0));
  S = s;
  layer = prerender(s, L.th);
  parts = [];
  cam.x = camTarget().x; cam.y = camTarget().y;
  return s;
}

function solidAt(tx, ty) {
  if (tx < 0 || ty < 0 || tx >= S.w || ty >= S.h) return true;
  return S.grid[ty][tx] === '#';
}

const SOLID = { solid: true };
// What is at world pixel (x,y)?  null = empty air.
function hitAt(x, y) {
  for (let i = 0; i < S.mvp.length; i++) {
    const m = S.mvp[i];
    if (x >= m.x && x < m.x + m.w && y >= m.y && y < m.y + m.h) return { pad: true, top: m.y, k: 'M', m: i };
  }
  const tx = Math.floor(x / TS), ty = Math.floor(y / TS);
  if (tx < 0 || ty < 0 || tx >= S.w || ty >= S.h) return SOLID;
  const ch = S.grid[ty][tx], lx = x - tx * TS, ly = y - ty * TS;
  switch (ch) {
    case '#': return SOLID;
    case 'S': case 'L': return { pad: true, top: ty * TS, k: ch };
    case '^': return ly >= 3 ? SOLID : null;
    case 'v': return ly < 5 ? SOLID : null;
    case '<': return lx >= 3 ? SOLID : null;
    case '>': return lx < 5 ? SOLID : null;
    case 'A': case 'B': case 'C': return S.open[ch] ? null : SOLID;
  }
  return null;
}

// Gravity + wind acceleration at a point.
function envAt(x, y) {
  const tx = x / TS, ty = y / TS;
  let gm = 1, ax = 0, ay = 0;
  for (const z of S.gz) if (tx >= z[0] && tx < z[0] + z[2] && ty >= z[1] && ty < z[1] + z[3]) gm = z[4];
  for (const z of S.wd) if (tx >= z[0] && tx < z[0] + z[2] && ty >= z[1] && ty < z[1] + z[3]) { ax += z[4]; ay += z[5]; }
  return { gx: ax, gy: G * gm + ay, gm };
}

function rocketPoints(r) {
  const ca = Math.cos(r.a), sa = Math.sin(r.a);
  return PTS.map(([px, py]) => [r.x + px * ca - py * sa, r.y + px * sa + py * ca]);
}

function hazardHit(pts) {
  for (const l of S.lz) {
    if (!laserOn(l, S.t)) continue;
    const c = (l[3] ? l[0] : l[1]) * TS + 4, a = (l[3] ? l[1] : l[0]) * TS, b = a + l[2] * TS;
    for (const [x, y] of pts) {
      const u = l[3] ? x : y, v = l[3] ? y : x;
      if (Math.abs(u - c) < 2 && v >= a && v <= b) return true;
    }
  }
  for (const e of S.en) {
    const p = enPos(e, S.t);
    for (const [x, y] of pts) if ((x - p.x) ** 2 + (y - p.y) ** 2 < 16) return true;
    if ((S.rocket.x - p.x) ** 2 + (S.rocket.y - p.y) ** 2 < 36) return true;
  }
  return false;
}

// One fixed-timestep tick of gameplay. inp = {up,left,right}. Pure w.r.t. S (sounds aside).
function stepGame(inp) {
  const s = S;
  if (s.status === 'dead') { s.deathT++; return; }
  if (s.status !== 'play') return;
  s.t++;
  const r = s.rocket;
  const prev = s.mvp;
  s.mvp = s.mv.map(m => mvPos(m, s.t));
  const wasRest = s.rest;
  if (wasRest && wasRest.m != null) { r.x += s.mvp[wasRest.m].x - prev[wasRest.m].x; r.y += s.mvp[wasRest.m].y - prev[wasRest.m].y; }

  if (inp.left) r.a -= ROT;
  if (inp.right) r.a += ROT;
  if (r.a > Math.PI) r.a -= 2 * Math.PI;
  if (r.a < -Math.PI) r.a += 2 * Math.PI;
  if (wasRest) { r.a = clamp(r.a, -SAFE_A + 0.02, SAFE_A - 0.02); if (!inp.left && !inp.right) r.a *= 0.9; }

  const thr = !!inp.up && s.fuel > 0;
  if (inp.up && s.fuel <= 0 && !s.emptyWarned) { s.emptyWarned = true; SFX.empty(); }
  s.thr = thr;
  if (thr) s.fuel--;
  const e = envAt(r.x, r.y);
  r.vx += e.gx + (thr ? Math.sin(r.a) * THR : 0);
  r.vy += e.gy - (thr ? Math.cos(r.a) * THR : 0);
  r.vx *= DRAG; r.vy *= DRAG;
  const sp = Math.hypot(r.vx, r.vy);
  if (sp > MAXV) { r.vx *= MAXV / sp; r.vy *= MAXV / sp; }
  r.x += r.vx; r.y += r.vy;

  // --- collisions with rock / pads / movers ---
  s.rest = null;
  let pts = rocketPoints(r), crash = false, feet = [];
  for (let i = 0; i < pts.length; i++) {
    const h = hitAt(pts[i][0], pts[i][1]);
    if (!h) continue;
    if (h.pad && i >= 5) feet.push(h); else { crash = true; break; }
  }
  // Still sitting on the pad while leveling out? Keep contact so the landing timer doesn't reset.
  if (!crash && !feet.length && wasRest && r.vy >= 0 && r.vy < 0.2) {
    for (let i = 5; i < 8; i++) { const h = hitAt(pts[i][0], pts[i][1] + 1); if (h && h.pad) feet.push(h); }
  }
  if (!crash && feet.length) {
    const top = Math.min(...feet.map(f => f.top));
    const low = Math.max(pts[5][1], pts[6][1], pts[7][1]);
    const safe = r.vy <= SAFE_VY && Math.abs(r.vx) <= SAFE_VX && Math.abs(r.a) <= SAFE_A && low - top <= 3.5;
    if (safe) {
      if (!wasRest && r.vy > 0.25) SFX.land();
      r.y -= low - top + 0.01;
      r.vy = 0; r.vx *= 0.6; if (Math.abs(r.vx) < 0.02) r.vx = 0;
      const f = feet.find(f => f.k === 'L') || feet[0];
      s.rest = { k: f.k, m: f.m };
      pts = rocketPoints(r);
    } else crash = true;
  }
  if (!crash) crash = hazardHit(pts);
  if (crash) { die(); return; }

  // --- pickups ---
  for (const st of s.stars) if (!st.got && (st.x - r.x) ** 2 + (st.y - r.y) ** 2 < 81) { st.got = true; SFX.collect(); sparkle(st.x, st.y, 10); }
  for (const w of s.sw) if (!w.on && (w.x - r.x) ** 2 + (w.y - r.y) ** 2 < 64) { w.on = true; s.open[w.k] = true; SFX.sw(); sparkle(w.x, w.y, 7); }

  // --- landing pad ---
  if (s.rest && s.rest.k === 'L') { if (++s.winN >= 30) s.status = 'complete'; }
  else s.winN = 0;
}

function die() {
  S.status = 'dead'; S.deathT = 0; S.thr = false;
  if (SIM) return;
  SFX.crash(); shake = 14;
  const r = S.rocket;
  for (let i = 0; i < 60; i++) {
    const a = Math.random() * Math.PI * 2, v = 0.3 + Math.random() * 2.4;
    parts.push({ x: r.x, y: r.y, vx: Math.cos(a) * v + r.vx * 0.3, vy: Math.sin(a) * v + r.vy * 0.3, life: 25 + Math.random() * 40,
                 c: [7, 10, 10, 9, 9, 8, 5][i % 7], g: 0.03 });
  }
}
function sparkle(x, y, c) {
  if (SIM) return;
  for (let i = 0; i < 12; i++) { const a = i / 12 * Math.PI * 2; parts.push({ x, y, vx: Math.cos(a) * 1.2, vy: Math.sin(a) * 1.2, life: 18, c, g: 0 }); }
}

// ---------------- Static level layer (pre-rendered) ----------------
function spikePix(u, v) {
  const s = u % 4;
  if (v === 7) return 5;
  if (v >= 5) return s === 3 ? -1 : (s === 0 ? 7 : 6);
  if (v >= 3) return s === 1 ? 7 : -1;
  return -1;
}
function prerender(s, th) {
  const c = document.createElement('canvas');
  c.width = s.w * TS; c.height = s.h * TS;
  const g = c.getContext('2d');
  const P = (x, y, w, h, col) => { g.fillStyle = PAL[col]; g.fillRect(x, y, w, h); };
  const sol = (x, y) => (x < 0 || y < 0 || x >= s.w || y >= s.h) ? true : s.grid[y][x] === '#';
  const solish = (x, y) => (x < 0 || y < 0 || x >= s.w || y >= s.h) ? true : '#SL'.includes(s.grid[y][x]);
  for (let ty = 0; ty < s.h; ty++) for (let tx = 0; tx < s.w; tx++) {
    const ch = s.grid[ty][tx], X = tx * TS, Y = ty * TS, h = hashi(tx, ty);
    if (ch === '#') {
      let deep = true;
      for (let j = -1; j <= 1; j++) for (let i = -1; i <= 1; i++) if (!sol(tx + i, ty + j)) deep = false;
      if (deep) {  // interior rock: dithered shade of the rock color
        P(X, Y, 8, 8, th[4]);
        g.fillStyle = PAL[th[2]];
        for (let y = 0; y < 8; y++) for (let x = (y & 1) * 2; x < 8; x += 4) g.fillRect(X + x + (y >> 1 & 1), Y + y, 1, 1);
      } else {
        P(X, Y, 8, 8, th[2]);
        P(X + 1 + (h >> 2) % 6, Y + 1 + (h >> 5) % 6, 1, 1, th[4]);
        if (h & 1) P(X + 1 + (h >> 8) % 5, Y + 1 + (h >> 11) % 6, 2, 1, th[4]);
        if (h & 2) P(X + 1 + (h >> 14) % 6, Y + 1 + (h >> 17) % 6, 1, 1, th[3]);
        if (!solish(tx, ty + 1)) P(X, Y + 7, 8, 1, th[4]);
        if (!solish(tx + 1, ty)) P(X + 7, Y, 1, 8, th[4]);
        if (!solish(tx, ty - 1)) { P(X, Y, 8, 1, th[3]); P(X, Y + 1, 8, 1, th[2]); }
        if (!solish(tx - 1, ty)) P(X, Y, 1, 8, th[3]);
      }
    } else if ('^v<>'.includes(ch)) {
      for (let y = 0; y < 8; y++) for (let x = 0; x < 8; x++) {
        let col;
        if (ch === '^') col = spikePix(x, y);
        else if (ch === 'v') col = spikePix(x, 7 - y);
        else if (ch === '<') col = spikePix(y, x);
        else col = spikePix(y, 7 - x);
        if (col >= 0) P(X + x, Y + y, 1, 1, col);
      }
    } else if (ch === 'S' || ch === 'L') {
      const top = ch === 'S' ? 6 : 11, sub = ch === 'S' ? 5 : 3;
      P(X, Y, 8, 3, top); P(X, Y, 8, 1, 7); P(X, Y + 3, 8, 5, 0);
      P(X + 1, Y + 3, 2, 5, sub); P(X + 5, Y + 3, 2, 5, sub); P(X, Y + 3, 8, 1, sub);
    }
  }
  return c;
}

// ---------------- Rendering ----------------
const ROCKET = ['...r...','..rrr..','..www..','.wwbww.','.wbbbw.','.wwbww.','.wwwww.','.wgggw.','rwwwwwr','rr.d.rr',
                '..oyo..','..oyo..','...o...','...r...'];
const RCOL = { r: 8, w: 7, b: 12, g: 6, d: 5, o: 9, y: 10 };
let tick = 0;

function sprPix(sx, sy, flameLen) {
  if (sx < 0 || sx > 6 || sy < 0) return -1;
  if (sy >= 10 + flameLen || sy >= ROCKET.length) return -1;
  const ch = ROCKET[sy][sx];
  return ch === '.' ? -1 : RCOL[ch];
}
// Rotated pixel-art sprite by inverse-mapping each screen pixel (keeps it chunky), with a dark outline.
function drawRocket(x, y, a, flameLen) {
  const cx = Math.round(x), cy = Math.round(y), ca = Math.cos(a), sa = Math.sin(a);
  const sample = (i, j) => {
    const dx = cx + i + 0.5 - x, dy = cy + j + 0.5 - y;
    const lx = dx * ca + dy * sa, ly = -dx * sa + dy * ca;
    return sprPix(Math.floor(lx + 3.5), Math.floor(ly + 5), flameLen);
  };
  for (let j = -11; j <= 11; j++) for (let i = -11; i <= 11; i++) {
    const c = sample(i, j);
    if (c >= 0) R(cx + i, cy + j, 1, 1, c);
    else if (sample(i + 1, j) >= 0 || sample(i - 1, j) >= 0 || sample(i, j + 1) >= 0 || sample(i, j - 1) >= 0) R(cx + i, cy + j, 1, 1, 0);
  }
}

function camTarget() {
  const mw = S.w * TS, mh = S.h * TS;
  const x = mw <= W ? (mw - W) / 2 : clamp(S.rocket.x - W / 2, 0, mw - W);
  const y = mh <= VIEWH ? (mh - VIEWH) / 2 : clamp(S.rocket.y - VIEWH / 2, 0, mh - VIEWH);
  return { x, y };
}

function drawBG(th, cx, cy) {
  R(0, HUDH, W, VIEWH, th[0]);
  const c = th[1], st = th[5];
  if (st === 3) {   // tech grid
    const ox = Math.round(-cx * 0.5) % 32, oy = Math.round(-cy * 0.5) % 32;
    for (let x = ox; x < W; x += 32) for (let y = HUDH; y < H; y += 2) R(x, y, 1, 1, c);
    for (let y = HUDH + oy + 32; y < H; y += 32) for (let x = 0; x < W; x += 2) R(x, y, 1, 1, c);
    return;
  }
  for (let i = 0; i < 70; i++) {
    let x = hash(i * 7 + 1) * 640 - cx * 0.4, y = hash(i * 13 + 5) * 360 - cy * 0.4;
    if (st === 1) y -= tick * (0.15 + 0.1 * (i % 3));          // bubbles rise
    if (st === 4) { y += tick * 2.5; x -= tick * 0.8; }         // rain falls
    if (st === 5) y -= tick * (0.3 + 0.2 * (i % 4));           // embers rise
    if (st === 6) x -= tick * (0.1 + 0.05 * (i % 3));          // clouds drift
    x = ((x % 640) + 640) % 640; y = ((y % 360) + 360) % 360;
    if (x >= W + 12 || y >= VIEWH + 4) continue;
    x = Math.floor(x); y = Math.floor(y) + HUDH;
    switch (st) {
      case 0: if ((tick + i * 37) % 150 > 8) R(x, y, 1, 1, c); if (i % 11 === 0) { R(x - 1, y, 3, 1, c); R(x, y - 1, 1, 3, c); } break;
      case 1: R(x, y, 2, 1, c); R(x - 1, y + 1, 1, 1, c); R(x + 2, y + 1, 1, 1, c); R(x, y + 2, 2, 1, c); break;
      case 2: R(x, y - 1, 1, 3, c); R(x - 1, y, 3, 1, c); break;
      case 4: R(x, y, 1, 3, c); break;
      case 5: if ((tick + i * 5) % 20 < 14) R(x, y, 1, 1, i % 2 ? c : 9); break;
      case 6: if (i % 3 === 0) { R(x, y, 14, 3, c); R(x + 3, y - 2, 7, 2, c); } break;
    }
  }
}

function drawZones() {
  for (const z of S.gz) {
    const x0 = z[0] * TS, y0 = z[1] * TS, w = z[2] * TS, h = z[3] * TS, low = z[4] < 1, col = low ? 12 : 8;
    for (let y = y0; y < y0 + h; y += 4) for (let x = x0 + ((y >> 2) & 1) * 4; x < x0 + w; x += 8) R(x, y, 1, 1, low ? 1 : 2);
    for (let i = 0; i < z[2] * z[3] / 6; i++) {
      const px = x0 + hash(i * 3 + z[0]) * w;
      let py = hash(i * 5 + z[1]) * h + (low ? -tick * 0.25 : tick * 1.5);
      py = y0 + ((py % h) + h) % h;
      R(Math.floor(px), Math.floor(py), 1, low ? 1 : 2, col);
    }
    txt(low ? 'LOW G' : 'HEAVY G', x0 + 2, y0 + 2, col);
  }
  for (const z of S.wd) {
    const x0 = z[0] * TS, y0 = z[1] * TS, w = z[2] * TS, h = z[3] * TS;
    const m = Math.hypot(z[4], z[5]), dx = z[4] / m, dy = z[5] / m, sp = 1 + m * 60;
    for (let i = 0; i < z[2] * z[3] / 3; i++) {
      let px = hash(i * 7 + z[0]) * w + dx * tick * sp, py = hash(i * 11 + z[1]) * h + dy * tick * sp;
      px = x0 + ((px % w) + w) % w; py = y0 + ((py % h) + h) % h;
      R(Math.floor(px), Math.floor(py), 1, 1, 6);
      R(Math.floor(px - dx * 2), Math.floor(py - dy * 2), 1, 1, 6);
      R(Math.floor(px - dx * 4), Math.floor(py - dy * 4), 1, 1, 5);
    }
  }
}

const DOORC = { A: 9, B: 14, C: 11 };
function drawDynamic() {
  const s = S;
  // doors
  for (let ty = 0; ty < s.h; ty++) for (let tx = 0; tx < s.w; tx++) {
    const ch = s.grid[ty][tx];
    if (ch !== 'A' && ch !== 'B' && ch !== 'C') continue;
    const X = tx * TS, Y = ty * TS, c = DOORC[ch];
    if (s.open[ch]) { R(X, Y, 1, 1, c); R(X + 7, Y, 1, 1, c); R(X, Y + 7, 1, 1, c); R(X + 7, Y + 7, 1, 1, c); }
    else { R(X, Y, 8, 8, c); R(X, Y + 2, 8, 1, 0); R(X, Y + 6, 8, 1, 0); R(X + 3, Y + 3, 2, 2, 7); }
  }
  // landing pad lights
  for (let ty = 0; ty < s.h; ty++) for (let tx = 0; tx < s.w; tx++)
    if (s.grid[ty][tx] === 'L' && ((tick >> 4) + tx) % 2 === 0) R(tx * TS + 3, ty * TS + 1, 2, 1, 10);
  // switches
  for (const w of s.sw) {
    const c = DOORC[w.k], x = w.x - 3, y = w.y - 3;
    R(x, y, 6, 6, 0); R(x + 1, y + 1, 4, 4, w.on ? 5 : c);
    if (!w.on && (tick >> 3) % 2) R(x + 2, y + 2, 2, 2, 7);
    if (w.on) R(x + 2, y + 2, 2, 2, 11);
  }
  // stars
  for (const st of s.stars) if (!st.got) {
    const bob = Math.round(Math.sin(tick * 0.08 + st.x) * 1);
    drawStarIcon(st.x - 2, st.y - 2 + bob, 10, 9);
    if ((tick + st.x) % 40 < 4) R(st.x + 3, st.y - 3 + bob, 1, 1, 7);
  }
  // lasers
  for (const l of s.lz) {
    const v = l[3], c = (v ? l[0] : l[1]) * TS + 4, a = (v ? l[1] : l[0]) * TS, b = a + l[2] * TS;
    const on = laserOn(l, s.t), warn = !on && laserWarn(l, s.t);
    if (on) {
      const core = tick % 4 < 2 ? 7 : 14;
      if (v) { R(c - 1, a, 3, b - a, 8); R(c, a, 1, b - a, core); } else { R(a, c - 1, b - a, 3, 8); R(a, c, b - a, 1, core); }
    } else if (warn && tick % 6 < 3) {
      for (let p = a; p < b; p += 4) v ? R(c, p, 1, 2, 8) : R(p, c, 2, 1, 8);
    }
    const ec = on ? 8 : 2;
    if (v) { R(c - 2, a, 5, 3, 5); R(c - 1, a + 1, 3, 1, ec); R(c - 2, b - 3, 5, 3, 5); R(c - 1, b - 2, 3, 1, ec); }
    else { R(a, c - 2, 3, 5, 5); R(a + 1, c - 1, 1, 3, ec); R(b - 3, c - 2, 3, 5, 5); R(b - 2, c - 1, 1, 3, ec); }
  }
  // movers
  for (const m of s.mvp) {
    const x = Math.round(m.x), y = Math.round(m.y);
    R(x, y, m.w, m.h, 5); R(x + 1, y + 1, m.w - 2, m.h - 2, 6);
    for (let i = 0; i < m.w; i += 4) { R(x + i, y, 2, 2, 10); R(x + i + 2, y, 2, 2, 0); }
    if (m.h > TS) for (let i = 0; i < m.w; i += 4) { R(x + i, y + m.h - 2, 2, 2, 10); R(x + i + 2, y + m.h - 2, 2, 2, 0); }
    if (m.h > 2 * TS) for (let j = y + 6; j < y + m.h - 6; j += 6) R(x + 2, j, m.w - 4, 1, 5);
  }
  // enemies
  for (const e of s.en) {
    const p = enPos(e, s.t), x = Math.round(p.x) - 3, y = Math.round(p.y) - 3;
    R(x + 1, y, 5, 1, 0); R(x, y + 1, 7, 4, 0); R(x + 1, y + 5, 1, 2, 0); R(x + 5, y + 5, 1, 2, 0);
    R(x + 1, y + 1, 5, 3, 8); R(x + 2, y + 1, 3, 1, 14);
    const eye = (tick >> 3) % 4 ? 10 : 7; R(x + 2, y + 2, 1, 1, eye); R(x + 4, y + 2, 1, 1, eye);
    const pr = (tick >> 1) % 2; R(x + (pr ? 0 : 4), y - 1, 3, 1, 6);
  }
}

function drawWorld() {
  const t = camTarget();
  cam.x += (t.x - cam.x) * 0.2; cam.y += (t.y - cam.y) * 0.2;
  let ox = Math.round(cam.x), oy = Math.round(cam.y);
  if (shake > 0) { ox += Math.round((Math.random() - 0.5) * shake * 0.4); oy += Math.round((Math.random() - 0.5) * shake * 0.4); shake--; }
  const th = LV[S.li].th;
  drawBG(th, ox, oy);
  ctx.save();
  ctx.beginPath(); ctx.rect(0, HUDH, W, VIEWH); ctx.clip();
  ctx.translate(-ox, HUDH - oy);
  drawZones();
  ctx.drawImage(layer, 0, 0);
  drawDynamic();
  const r = S.rocket;
  if (S.status !== 'dead') drawRocket(r.x, r.y, r.a, S.thr ? 1 + (tick * 7 % 4) : 0);
  else if (S.deathT < 12) {
    const rad = 3 + S.deathT * 1.6;
    for (let k = 0; k < 24; k++) { const a = k / 24 * Math.PI * 2; R(Math.round(r.x + Math.cos(a) * rad), Math.round(r.y + Math.sin(a) * rad), 2, 2, S.deathT < 6 ? 7 : 10); }
  }
  for (const p of parts) R(Math.round(p.x), Math.round(p.y), 1, 1, p.c);
  ctx.restore();
}

function landState() {
  const r = S.rocket;
  if (Math.abs(r.a) > SAFE_A) return ['TILT', 8];
  if (r.vy > SAFE_VY || Math.abs(r.vx) > SAFE_VX) return ['FAST', 8];
  return ['SAFE', 11];
}

function drawHUD() {
  R(0, 0, W, HUDH, 0); R(0, HUDH - 1, W, 1, 5);

let ditherPat = null;

function finishLevel() {
  const s = S, li = s.li, L = LV[li];
  const stars = s.stars.filter(x => x.got).length;
  const secs = s.t / 60, fuelPct = Math.round(s.fuel / s.maxFuel * 100);
  const score = stars * 1000 + fuelPct * 20 + Math.max(0, Math.round(3000 - secs * 25));
  const prevBest = SAVE.best[li];
  SAVE.stars[li] = Math.max(SAVE.stars[li], stars);
  SAVE.best[li] = Math.max(prevBest, score);
  if (li + 2 > SAVE.unlocked) SAVE.unlocked = Math.min(25, li + 2);
  persist();
  result = { li, stars, secs, fuelPct, score, best: score > prevBest, last: li === LV.length - 1, name: L.n };
  SFX.win();
  setThrustSound(false);
  scene = 'complete'; menuSel = 0;
}

// ---------------- Input ----------------
const keys = {};
const KEYMAP = { ArrowUp: 'up', ' ': 'up', w: 'up', W: 'up', ArrowLeft: 'left', a: 'left', A: 'left', ArrowRight: 'right', d: 'right', D: 'right', ArrowDown: 'down', s: 'down', S: 'down' };
function held(n) { for (const k in keys) if (keys[k] && KEYMAP[k] === n) return true; return false; }

addEventListener('keydown', e => {
  audioInit();
  const k = e.key;
  if (k === ' ' || k.startsWith('Arrow')) e.preventDefault();
  const fresh = !keys[k];
  keys[k] = true;
  if (fresh) onPress(k);
});
addEventListener('keyup', e => { keys[e.key] = false; });
addEventListener('blur', () => { for (const k in keys) keys[k] = false; });

function onPress(k) {
  const kl = k.length === 1 ? k.toLowerCase() : k, ok = k === 'Enter' || k === ' ';
  if (kl === 'm') { setMuted(!SAVE.muted); return; }
  const nav = (n, d) => { menuSel = (menuSel + d + n) % n; SFX.blip(); };
  if (scene === 'title') {
    if (k === 'ArrowUp' || k === 'ArrowDown') nav(2, k === 'ArrowUp' ? -1 : 1);
    else if (ok) { if (menuSel === 0) startGame(); else { scene = 'select'; selCur = Math.min(SAVE.unlocked - 1, 24); SFX.select(); } }
  } else if (scene === 'select') {
    const d = { ArrowLeft: -1, ArrowRight: 1, ArrowUp: -5, ArrowDown: 5 }[k];
    if (d) { const n = selCur + d; if (n >= 0 && n < 25) { selCur = n; SFX.blip(); } }
    else if (ok) { if (selCur < SAVE.unlocked) playLevel(selCur); else SFX.empty(); }
    else if (k === 'Escape' || k === 'Backspace') { scene = 'title'; menuSel = 1; SFX.blip(); }
  } else if (scene === 'play') {
    if (kl === 'p' || k === 'Escape') { scene = 'pause'; menuSel = 0; setThrustSound(false); SFX.blip(); }
    else if (kl === 'r') loadLevel(S.li);
  } else if (scene === 'pause') {
    if (kl === 'p' || k === 'Escape') { scene = 'play'; SFX.blip(); }
    else if (k === 'ArrowUp' || k === 'ArrowDown') nav(3, k === 'ArrowUp' ? -1 : 1);
    else if (ok) { SFX.select(); PAUSE_ITEMS[menuSel][1](); if (S) S.lock = true; }
  } else if (scene === 'complete') {
    if (k === 'ArrowLeft' || k === 'ArrowRight') nav(3, k === 'ArrowLeft' ? -1 : 1);
    else if (ok) [nextLevel, () => playLevel(result.li), () => { scene = 'select'; selCur = result.li; }][menuSel]();
    else if (kl === 'r') playLevel(result.li);
    else if (k === 'Escape') { scene = 'select'; selCur = result.li; }
  }
}

function toCanvas(e) {
  const b = cv.getBoundingClientRect();
  return { x: (e.clientX - b.left) * W / b.width, y: (e.clientY - b.top) * H / b.height };
}
cv.addEventListener('mousemove', e => { mouse = toCanvas(e); });
cv.addEventListener('mouseleave', () => { mouse = { x: -1, y: -1 }; });
cv.addEventListener('pointerdown', e => {
  audioInit();
  const p = toCanvas(e); mouse = p;
  for (let i = btns.length - 1; i >= 0; i--) {
    const b = btns[i];
    if (p.x >= b.x && p.x < b.x + b.w && p.y >= b.y && p.y < b.y + b.h) { b.fn(); if (S) S.lock = true; return; }
  }
});

// ---------------- Main loop ----------------
let SIM = false, TEST = false;

function update() {
  tick++;
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += p.g; p.vx *= 0.98; p.life--; }
  parts = parts.filter(p => p.life > 0);
  if (scene !== 'play') { setThrustSound(false); return; }
  const inp = { up: held('up'), left: held('left'), right: held('right') };
  if (S.lock) { if (!inp.up) S.lock = false; inp.up = false; }
  stepGame(inp);
  setThrustSound(S.thr && S.status === 'play');
  if (S.thr && tick % 2 === 0) {
    const r = S.rocket, sa = Math.sin(r.a), ca = Math.cos(r.a);
    parts.push({ x: r.x - sa * 7, y: r.y + ca * 7, vx: -sa * 1 + r.vx + (Math.random() - 0.5) * 0.4, vy: ca * 1 + r.vy, life: 14, c: tick % 4 ? 5 : 6, g: 0 });
  }
  if (S.status === 'dead' && S.deathT > 55) loadLevel(S.li, S.attempt + 1);
  else if (S.status === 'complete') finishLevel();
}

function render() {
  btns = [];
  if (scene === 'title') renderTitle();
  else if (scene === 'select') renderSelect();
  else if (scene === 'play' || scene === 'pause') renderPlay();
  else if (scene === 'complete') renderComplete();
}

let last = performance.now(), acc = 0;
function frame(now) {
  acc += Math.min(100, now - last); last = now;
  if (!TEST) {
    while (acc >= 1000 / 60) { update(); acc -= 1000 / 60; }
    render();
  }
  requestAnimationFrame(frame);
}

function fit() {
  const s = Math.min(innerWidth / W, innerHeight / H);
  const si = Math.floor(s);
  const sc = si >= 1 && si / s > 0.85 ? si : s;
  cv.style.width = Math.floor(W * sc) + 'px';
  cv.style.height = Math.floor(H * sc) + 'px';
}
addEventListener('resize', fit);
fit();
requestAnimationFrame(frame);

// Hooks for the automated playtester (harmless in normal play).
window.__PR = {
  LV, G, THR, ROT, SAFE_VY, SAFE_VX, SAFE_A,
  get S() { return S; },
  get layer() { return layer; },
  test(on) { TEST = on; },
  load(i) { return loadLevel(i); },
  play(i) { playLevel(i); },
  get scene() { return scene; },
  step(inp) { stepGame(inp); },
  snapshot() { return structuredClone(S); },
  restore(s) { S = s; },
  sim(on) { SIM = on; },
  envAt, mvPos, enPos, laserOn
};
</script>
